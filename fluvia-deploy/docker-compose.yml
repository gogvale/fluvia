services:
  # Public front: TLS via Let's Encrypt (real cert = CT-log discovery channel),
  # then reverse-proxy to the lure. This is the only service exposed on 80/443.
  caddy:
    image: caddy:2-alpine
    container_name: fluvi-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/log:/var/log/caddy
    depends_on:
      - fluvi-web
    restart: unless-stopped

  # Fluvia lure web (FICTIONAL on/off-ramp) — internal only, reachable via Caddy.
  fluvi-web:
    build: ./fluvi-app
    container_name: fluvi-web
    expose:
      - "8000"
    environment:
      - EVIDENCE_DIR=/evidence
    volumes:
      - ./evidence:/evidence
    restart: unless-stopped

  # Cowrie SSH honeypot on :22 (host sshd moved to 64221 by setup.sh).
  cowrie:
    image: cowrie/cowrie:latest
    container_name: fluvi-cowrie
    ports:
      - "22:2222"
    environment:
      - COWRIE_HONEYPOT_AUTH_CLASS=UserDB
      - COWRIE_HONEYPOT_HOSTNAME=fluvia-prod
    volumes:
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./cowrie/log:/cowrie/cowrie-git/var/log/cowrie
    restart: unless-stopped

  # FEATURE 1 — fake-C2 responder. Lives on the host network so the nftables sinkhole
  # redirect (sinkhole/apply.sh: targets.txt -> SINK_PORT) lands on it. Every connection
  # it answers is logged to evidence/fakec2.jsonl with the ORIGINAL destination.
  fake-c2:
    build: ./fake-c2
    container_name: fluvi-fakec2
    network_mode: host
    environment:
      - EVIDENCE_DIR=/evidence
      - SINK_PORT=${SINK_PORT:-9001}
      - EXTRA_PORTS=2535,8080,6021
    volumes:
      - ./evidence:/evidence
    restart: unless-stopped

  # FEATURE 3a — passive TLS fingerprinting (JA3/JA4) for actor clustering on the web side.
  # Host networking + af-packet on the primary NIC; eve.json -> classify/eve/.
  suricata:
    image: ${SURICATA_IMAGE:-jasonish/suricata:latest}
    container_name: fluvi-ja3
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./classify/eve:/var/log/suricata
    # ja3 is off by default in the upstream config — turn it on explicitly.
    command: ["-i", "${IFACE:-eth0}", "--set", "app-layer.protocols.tls.ja3-fingerprints=yes"]
    restart: unless-stopped
